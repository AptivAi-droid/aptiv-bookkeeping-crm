# Aptiv Bookkeeping CRM — Netlify Deployment Config
# Kenya Edition

[build]
  command = "npm run build"
  publish = "dist"

# SPA routing — all paths serve index.html
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

# Security headers (financial-grade)
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "DENY"
    # Prevent MIME sniffing
    X-Content-Type-Options = "nosniff"
    # XSS protection (legacy browsers)
    X-XSS-Protection = "1; mode=block"
    # Referrer policy — don't leak URL to third parties
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Permissions policy — disable unnecessary browser features
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # HSTS — enforce HTTPS for 1 year
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Content Security Policy
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: https:;
      font-src 'self' data:;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co https://sandbox.safaricom.co.ke https://api.safaricom.co.ke;
      frame-ancestors 'none';
    """

# Static asset caching
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[context.production.environment]
  VITE_MPESA_ENV = "production"

[context.deploy-preview.environment]
  VITE_MPESA_ENV = "sandbox"
