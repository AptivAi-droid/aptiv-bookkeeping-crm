# ============================================================
# Aptiv Bookkeeping CRM — Kenya Edition
# GitHub Pages Auto-Deploy Workflow
# ============================================================
# SECURITY NOTE:
# Only VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY are safe to pass
# as VITE_ build vars (they are meant to be public — Supabase RLS handles security).
#
# M-Pesa CONSUMER_KEY, CONSUMER_SECRET, PASSKEY and BRIDGE_API_KEY
# are server-side secrets. They MUST be stored in Supabase Vault:
#   supabase secrets set MPESA_CONSUMER_KEY=...
#   supabase secrets set MPESA_CONSUMER_SECRET=...
#   supabase secrets set MPESA_SHORTCODE=...
#   supabase secrets set MPESA_PASSKEY=...
#   supabase secrets set MPESA_CALLBACK_URL=...
#   supabase secrets set BRIDGE_API_URL=...
#   supabase secrets set BRIDGE_API_KEY=...
# They are accessed server-side via the mpesa-proxy and bridge-proxy edge functions.
# ============================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # ── 1. Checkout ─────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node 20 + npm cache ────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install ────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Lint ───────────────────────────────────────────
      - name: Lint
        run: npm run lint
        continue-on-error: false

      # ── 5. Build ──────────────────────────────────────────
      - name: Build Vite app
        run: npm run build
        env:
          # Base path — set to / when using a custom domain
          VITE_BASE_PATH: ${{ secrets.VITE_BASE_PATH || '/aptiv-bookkeeping-crm/' }}

          # ── SAFE to expose (Supabase anon key is public by design) ──────
          # RLS policies in Supabase handle all access control.
          VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

          # M-Pesa sandbox/production toggle (not a secret)
          VITE_MPESA_ENV: ${{ secrets.VITE_MPESA_ENV || 'sandbox' }}

          # ── DO NOT ADD M-Pesa or bridge secrets here ─────────────────────
          # MPESA_CONSUMER_KEY, MPESA_CONSUMER_SECRET, MPESA_PASSKEY,
          # BRIDGE_API_KEY must be stored in Supabase Vault only.
          # See: supabase/functions/mpesa-proxy/index.ts

      # ── 6. Deploy to gh-pages ─────────────────────────────
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          commit-message: "deploy: ${{ github.sha }}"
